name: 📱 BrainRot Mobile Build

on:
  push:
    branches: [main, master, arena/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build web
        run: npm run build
      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Cap Doctor
        run: npx cap doctor || true
      - name: Sync Capacitor (copy + update)
        run: |
          echo "=== Running cap copy ==="
          npx cap copy android 2>&1 || echo "copy failed"
          echo "=== Running cap update ==="
          npx cap update android 2>&1 || echo "update failed"
          echo "=== Listing assets ==="
          ls -lh android/app/src/main/assets/public/ | head -n 20
          echo "=== Sync done ==="
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  build-pwa:
    name: 🔧 PWA Audit
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install & Build
        run: |
          npm ci
          npm run build
      - name: Serve & Lighthouse
        run: |
          npm install -g serve
          serve -s dist -l 3000 &
          sleep 5
          npx lighthouse http://localhost:3000 --only-categories=pwa,performance,accessibility --chrome-flags="--headless --no-sandbox" --output=json --output-path=./lighthouse.json || true
      - name: Check manifest
        run: |
          cat public/manifest.json
