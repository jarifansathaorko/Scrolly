name: 📱 BrainRot Mobile Build

on:
  push:
    branches: [main, master, arena/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap doctor
          for i in 1 2 3; do
            echo "Attempt $i: cap copy"
            npx cap copy android && break || sleep 5
          done
          for i in 1 2 3; do
            echo "Attempt $i: cap update"
            npx cap update android && break || sleep 5
          done
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
