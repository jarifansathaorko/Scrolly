name: 📱 BrainRot Mobile Build

on:
  push:
    branches: [main, master, arena/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap doctor
          npx cap copy android
          npx cap update android
          ls -lh android/app/src/main/assets/public/ | head
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          echo "=== GRADLE LOG TAIL ==="
          tail -n 200 ../gradle.log
      - name: Push logs on failure
        if: failure()
        run: |
          echo "Build failed, pushing logs to debug-logs branch"
          cat ../gradle.log 2>/dev/null | tail -n 500 || cat gradle.log | tail -n 500 || echo "no log"
          git config user.name "CI"
          git config user.email "ci@brainrot.app"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -B debug-logs
          cp ../gradle.log ./gradle.log 2>/dev/null || cp gradle.log ./gradle.log 2>/dev/null || echo "no gradle log" > gradle.log
          ls -lh *.log || true
          git add gradle.log
          git commit -m "gradle failure log $GITHUB_RUN_ID" || true
          git push origin debug-logs --force --verbose 2>&1 | tail -n 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
