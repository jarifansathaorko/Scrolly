name: 📱 BrainRot Mobile Build

on:
  push:
    branches: [main, master, arena/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor with logs
        run: |
          set -x
          npx cap doctor
          ls -la
          ls -la android/
          echo "--- capacitor.config.ts ---"
          cat capacitor.config.ts
          echo "--- TRY COPY ---"
          npx cap copy android 2>&1 | tee /tmp/copy.log
          COPY_EXIT=${PIPESTATUS[0]}
          echo "COPY EXIT: $COPY_EXIT"
          cat /tmp/copy.log
          if [ $COPY_EXIT -ne 0 ]; then
            echo "COPY FAILED"
            exit $COPY_EXIT
          fi
          echo "--- TRY UPDATE ---"
          npx cap update android 2>&1 | tee /tmp/update.log
          UPDATE_EXIT=${PIPESTATUS[0]}
          echo "UPDATE EXIT: $UPDATE_EXIT"
          cat /tmp/update.log
          exit $UPDATE_EXIT
      - name: Post logs to commit on failure
        if: failure()
        run: |
          echo "Posting failure logs to commit comment..."
          LOG=$(cat /tmp/copy.log /tmp/update.log 2>&1 | tail -n 200)
          echo "$LOG"
          # Use gh api to comment
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="**Build failed** - cap logs:\n\`\`\`\n$LOG\n\`\`\`" || echo "failed to post comment"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
