name: 📱 BrainRot Mobile Build

on:
  push:
    branches: [main, master, arena/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap doctor
          npx cap copy android 2>&1 | tee copy.log
          echo "COPY_EXIT:${PIPESTATUS[0]}"
          npx cap update android 2>&1 | tee update.log
          echo "UPDATE_EXIT:${PIPESTATUS[0]}"
      - name: Upload logs to gist on failure
        if: failure()
        run: |
          echo "Creating gist..."
          cat copy.log
          cat update.log
          CONTENT=$(cat copy.log update.log 2>&1 | tail -c 9000 | base64 -w 0 || cat copy.log update.log | tail -c 9000)
          # Try to create gist via curl
          curl -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
            -d "{\"description\":\"Build logs $GITHUB_RUN_ID\",\"public\":false,\"files\":{\"copy.log\":{\"content\": $(cat copy.log | jq -Rs .)},\"update.log\":{\"content\": $(cat update.log | jq -Rs .)}}}" \
            https://api.github.com/gists || echo "gist failed"
          # Also try gh api
          gh api gists -f public=false -f description="Build logs $GITHUB_RUN_ID" -f files[copy.log][content]="$(cat copy.log | head -c 8000)" || echo "gh gist failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
