name: 📱 BrainRot Mobile Build

on:
  push:
    branches: [main, master, arena/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap doctor 2>&1 | tee /tmp/doctor.log
          npx cap copy android 2>&1 | tee /tmp/copy.log; echo "EXIT:$?" >> /tmp/copy.log
          cat /tmp/copy.log
          npx cap update android 2>&1 | tee /tmp/update.log; echo "EXIT:$?" >> /tmp/update.log
          cat /tmp/update.log
          # Check for failure
          if grep -q "EXIT:1" /tmp/copy.log || grep -q "EXIT:1" /tmp/update.log; then
            echo "SYNC FAILED"
            exit 1
          fi
      - name: Push sync logs on failure
        if: failure()
        run: |
          set -x
          git config user.name "CI"
          git config user.email "ci@brainrot.app"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -B debug-logs
          cp /tmp/*.log ./ || true
          ls -lh *.log
          cat /tmp/copy.log || true
          git add *.log || true
          git commit -m "sync logs $GITHUB_RUN_ID" || true
          git push origin debug-logs --force 2>&1 | tee /tmp/push.log
          cat /tmp/push.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
